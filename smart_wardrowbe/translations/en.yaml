configuration:
  gemini_api_key:
    name: Gemini API key
    description: >-
      Key from https://aistudio.google.com/apikey. Without a key the app starts but does not
      recognise clothes. Product photos need billing enabled in Google AI Studio.
  household_profiles:
    name: Household members
    description: >-
      Comma-separated names, e.g. "Anna, Ben, Cara". Each name becomes a button on the sign-in
      screen.
  app_url:
    name: App address
    description: >-
      The app's home address, e.g. http://192.168.0.10:3000. Used for links in notifications;
      the app itself works on any address you open it on, Tailscale included.
  ai_model:
    name: AI model
    description: Gemini model used to recognise clothes and build outfits.
  product_photos:
    name: Automatic product photos
    description: >-
      Gemini redraws every new photo as a pressed product photo on a white background. Costs a
      few cents per photo and needs a key with billing enabled. The original photo is always kept.
  photo_model:
    name: Product photo model
    description: >-
      Gemini image model for product photos. If the name does not exist (any more), the app tries
      the known alternatives itself.
  photo_resolution:
    name: Product photo sharpness
    description: >-
      1K costs about $0.07 per photo. 2K shows the fabric and fine weaves more sharply and costs
      about $0.10 per photo.
network:
  3000/tcp: Web interface (open this on the tablet)
