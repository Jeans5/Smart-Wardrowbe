configuration:
  gemini_api_key:
    name: Gemini API-key
    description: >-
      Key van https://aistudio.google.com/apikey. Zonder key start de app wel, maar herkent
      ze geen kleding. Voor productfoto's moet facturering aan staan in Google AI Studio.
  household_profiles:
    name: Gezinsleden
    description: >-
      Namen gescheiden door komma's, bv. "Anna, Bram, Cas". Elke naam wordt een knop op het
      aanmeldscherm.
  app_url:
    name: Adres van de app
    description: >-
      Het adres van de app thuis, bv. http://192.168.0.10:3000. Wordt gebruikt voor links in
      meldingen; de app zelf werkt op elk adres waarop je ze opent, ook via Tailscale.
  ai_model:
    name: AI-model
    description: Gemini-model voor het herkennen van kleding en het maken van outfits.
  product_photos:
    name: Automatische productfoto's
    description: >-
      Elke nieuwe foto wordt door Gemini hertekend als een gestreken productfoto op een witte
      achtergrond. Kost enkele centen per foto en werkt alleen met een key waarvoor facturering
      aan staat. De originele foto blijft altijd bewaard.
  photo_model:
    name: Model voor productfoto's
    description: >-
      Gemini-beeldmodel voor de productfoto's. Bestaat de naam niet (meer), dan probeert de app
      zelf de bekende alternatieven.
  photo_resolution:
    name: Scherpte van productfoto's
    description: >-
      1K kost ongeveer € 0,06 per foto. 2K toont de stof en fijne weefsels scherper en kost
      ongeveer € 0,09 per foto.
network:
  3000/tcp: Webinterface (open dit op de tablet)
